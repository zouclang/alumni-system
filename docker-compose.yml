services:
  alumni-app:
    build: .
    container_name: alumni-system
    ports:
      - "8085:8085"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=8085
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - NEXT_PUBLIC_APP_URL=http://godii.top:8085
    restart: always
